name: Build Qt App (Qt 6.9, macOS 15, Win10)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10 target (MSVC)
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            winver: "10.0"
            qt_host: "windows"
            qt_target: "desktop"
            qt_arch: "win64_msvc2022_64"
            qt_dir: "msvc2022_64"
            qt_ver: "6.9.3"
            app_name: "appLanHuyStore"
            
          # macOS 15 (Sequoia) target
          - os: macos-15
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            osx_deployment: "15.0"
            qt_host: "mac" 
            qt_target: "desktop"
            qt_arch: "clang_64"
            qt_dir: "macos"
            qt_ver: "6.9.3"
            app_name: "appLanHuyStore"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      # ---- Install Qt 6.9 via aqt ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqt + ninja
        run: pip install aqtinstall ninja

      - name: find valuable arch and module for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          aqt list-qt mac desktop --arch 6.9.3
          aqt list-qt mac desktop --modules 6.9.3

      - name: Install Qt 6.9 + QML modules
        shell: bash
        run: |
          python -m aqt install-qt --outputdir $HOME/Qt \
            "${{ matrix.qt_host }}" "${{ matrix.qt_target }}" "${{ matrix.qt_ver }}" "${{ matrix.qt_arch }}" \
            --modules qtcharts 

          echo "QT_BIN=$HOME/Qt/6.9.3/${{ matrix.qt_dir }}/bin" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.9.3/${{ matrix.qt_dir }}" >> $GITHUB_ENV

      - name: debug Qt path
        shell: bash
        run: |
          echo "CMAKE_PREFIX_PATH=${{ env.CMAKE_PREFIX_PATH }}"
          ls -la "${{ env.CMAKE_PREFIX_PATH }}" || true
          find "${{ env.CMAKE_PREFIX_PATH }}" -maxdepth 3 -name "Qt6Config.cmake" -print || true

      # ---- Configure & Build ----
      - name: Setup MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $QT_PREFIX = "${env:CMAKE_PREFIX_PATH}"
          cmake -S $env:GITHUB_WORKSPACE -B $env:GITHUB_WORKSPACE\build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" `
            -DQt6_DIR="$QT_PREFIX\lib\cmake\Qt6"
        
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          QT_PREFIX="${{ env.CMAKE_PREFIX_PATH }}"
          cmake -S ${{ github.workspace }} -B ${{ steps.strings.outputs.build-output-dir }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DQt6_DIR="$QT_PREFIX/lib/cmake/Qt6" \
            echo "-DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.osx_deployment }}") 

            
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build $env:GITHUB_WORKSPACE\build --config ${{ matrix.build_type }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      # ---- Bundle Qt runtime ----
      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          "${{ env.QT_BIN }}/windeployqt.exe" --release "${{ steps.strings.outputs.build-output-dir }}\\${{ matrix.app_name }}.exe" --qmldir=.

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          "${{ env.QT_BIN }}/macdeployqt" "${{ steps.strings.outputs.build-output-dir }}/${{ matrix.app_name }}.app" -qmldir=. -dmg

      # ---- Upload artifacts ----
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            ${{ steps.strings.outputs.build-output-dir }}/**/*.exe
            ${{ steps.strings.outputs.build-output-dir }}/**/*.dll
            ${{ steps.strings.outputs.build-output-dir }}/**/*.app
            ${{ steps.strings.outputs.build-output-dir }}/**/*.dmg
            ${{ steps.strings.outputs.build-output-dir }}/**/ManagerStorageApp*
